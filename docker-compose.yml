services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Madrid
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - internal

  openhands:
    image: ghcr.io/all-hands-ai/openhands:0.38
    container_name: openhands
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LOG_ALL_EVENTS=true
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:0.38-nikolaik
    volumes:
      - oh_data:/.openhands-state
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  n8n_data:
  oh_data:

